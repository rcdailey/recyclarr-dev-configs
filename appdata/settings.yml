# yaml-language-server: $schema=../../recyclarr/schemas/settings-schema.json

# Edit this file to customize the behavior of Recyclarr beyond its defaults
# For the settings file reference guide, visit the link to the wiki below:
# https://recyclarr.dev/wiki/yaml/settings-reference/

notifications:
  apprise:
    mode: stateful
    base_url: !env_var APPRISE_URL http://localhost:8000
    key: recyclarr
  verbosity: verbose

resource_providers:
  - name: radarr-custom-cfs
    type: custom-formats
    path: custom-formats/radarr
    service: radarr
  - name: sonarr-custom-cfs
    type: custom-formats
    path: custom-formats/sonarr
    service: sonarr
  # Guide data not yet upstream (e.g. trash_quality_definition on Sonarr profiles)
  - name: guides-local
    type: trash-guides
    path: guides-local
